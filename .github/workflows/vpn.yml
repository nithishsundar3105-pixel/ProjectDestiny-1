name: Market Cap Collection - 2 vpn pluggedIn

# on:
#   workflow_dispatch:



on:
  workflow_dispatch:        # keep manual trigger
  # schedule:
  #   - cron: '10 3,9,15,21 * * *'   # every 6 hours, on the hour (00:00, 06:00, 12:00, 18:00 UTC)

permissions:
  contents: write
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Connect to VPN (WireGuard)
        uses: kazimanzurrashid/wireguard-action@v1
        with:
          config: ${{ secrets.WIREGUARD_CONFIG }}
        # The action above accepts a full WireGuard .conf file via the `config`
        # input. Store it as a repo/org secret named WIREGUARD_CONFIG.
        #
        # ALTERNATIVE (OpenVPN):
        # uses: kota65535/github-openvpn-connect-action@v3
        # with:
        #   config_file: ${{ secrets.OVPN_CONFIG }}
        #   username: ${{ secrets.OVPN_USERNAME }}
        #   password: ${{ secrets.OVPN_PASSWORD }}

      - name: Verify VPN connection
        shell: bash
        run: |
          echo "Public IP before/after VPN:"
          curl -s https://ifconfig.me || true
          echo
          # Optional: fail fast if VPN didn't come up
          if ! ip link show | grep -qiE 'wg0|tun0|tap0'; then
            echo "::warning::No VPN interface detected (wg0/tun0/tap0)."
          fi

      - name: Run collection
        id: collection
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          d="2026-01-01"
          end="2026-09-30"
          start_time=$(date +%s)
          max_seconds=18900

          while [[ "$d" < "$end" || "$d" == "$end" ]]; do
            elapsed=$(( $(date +%s) - start_time ))

            if (( elapsed >= max_seconds )); then
              echo "Time budget reached; continuing in next run."
              break
            fi

            echo "Processing $d"
            node arc/MarketCap.js "$d" || exit 1

            next=$(date -d "$d + 1 day" +%F)

            git add .

            if ! git diff --cached --quiet; then
              git commit -m "Market cap data: $d"
              git push origin HEAD:main
            fi

            d="$next"
          done

          if [[ "$d" > "$end" ]]; then
            echo "has_more=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_more=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Disconnect VPN
        if: always()
        shell: bash
        run: |
          # WireGuard
          sudo wg-quick down wg0 2>/dev/null || true
          # OpenVPN (if used)
          sudo pkill -f openvpn 2>/dev/null || true

      - name: Start next run
        if: success() && steps.collection.outputs.has_more == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'market-cap.yml',
              ref: 'main'
            });